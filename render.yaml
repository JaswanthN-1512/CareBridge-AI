services:
  - type: web
    name: carebridge-ai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: VECTOR_STORE_TYPE
        value: faiss
      - key: LOG_LEVEL
        value: info
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: FRONTEND_URL
        value: https://carebridge-ai.vercel.app,http://localhost:5173
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
